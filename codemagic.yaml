# Codemagic CI — Koala iOS (App Store / TestFlight)
# Windows'tan Mac olmadan iOS build almak için. Repoyu codemagic.io'ya bağla,
# aşağıdaki ortam değişkenlerini ve App Store Connect entegrasyonunu gir.
#
# ÖN KOŞULLAR (Codemagic UI → app settings):
#   1. Integrations → App Store Connect → API key ekle (Gökhan'ın hesabından
#      oluşturulan .p8 + Key ID + Issuer ID). Entegrasyon adını aşağıda
#      `app_store_connect` altında `auth: integration` ile eşleştir.
#   2. Environment variables (group: "koala_ios") — tümü "Secure":
#        REVENUECAT_IOS_KEY        = appl_xxxxxxxx
#        SUPABASE_ANON_KEY         = sb_publishable_...
#        EVLUMBA_SUPABASE_ANON_KEY = eyJ...
#   3. ios/Runner/GoogleService-Info.plist repoda OLMALI (Firebase iOS app'ten
#      indir). Yoksa Firebase init + build BAŞARISIZ olur.
#   4. Apple Developer'da App ID com.koala.evlumba + Push Notifications
#      capability tanımlı olmalı; bundle id App Store Connect'te kayıtlı app'e
#      bağlı olmalı (ASC app 6768194106 "Koala" = com.koala.evlumba).

workflows:
  ios-appstore:
    name: Koala iOS — App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: koala_appstore_api   # Codemagic UI'daki entegrasyon adı
    environment:
      ios_signing:
        certificates:
          - koala_ios_distribution      # Code signing identities'deki sertifika
        provisioning_profiles:
          - koala_appstore_profile      # Koala App Store CM (com.koala.evlumba)
      groups:
        - koala_ios            # REVENUECAT_IOS_KEY, SUPABASE_ANON_KEY, EVLUMBA_SUPABASE_ANON_KEY
      vars:
        APP_VERSION: "2.0.0-preview+184"
        KOALA_API_URL: "https://koala-api-olive.vercel.app"
        SUPABASE_URL: "https://xgefjepaqnghaotqybpi.supabase.co"
        EVLUMBA_SUPABASE_URL: "https://vgtgcjnrsladdharzkwn.supabase.co"
        BUNDLE_ID: "com.koala.evlumba"
      flutter: 3.41.3   # lokal surumle ayni; "stable" (3.44+) lucide_icons'u kirar (IconData final)
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Set up provisioning (automatic via ASC API key)
        script: |
          # "Koala App Store CM" profili portalda mevcut (build #5'te olusturuldu).
          xcode-project use-profiles
      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA (release, dart-defines)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=AI_PROVIDER=gemini \
            --dart-define=KOALA_API_URL="$KOALA_API_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=EVLUMBA_SUPABASE_URL="$EVLUMBA_SUPABASE_URL" \
            --dart-define=EVLUMBA_SUPABASE_ANON_KEY="$EVLUMBA_SUPABASE_ANON_KEY" \
            --dart-define=REVENUECAT_IOS_KEY="$REVENUECAT_IOS_KEY" \
            --dart-define=REQUIRE_LOGIN=true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true     # önce TestFlight — gerçek cihazda test et
        # submit_to_app_store: false   # TestFlight'ta doğrulayınca true yap
      email:
        recipients:
          - canozdogan@outlook.com
        notify:
          success: true
          failure: true
