  <!-- 2026-04-27: Aggressive cache-bust — bu build'in versiyonunu localStorage'da
       tut, eski versiyondaysa SW + cacheStorage temizle ve sayfayı bir kez

       kullanıcıya yeni index.html veriyor (no-cache).
       2026-05-28: BUILD_VERSION'ı `window.__KOALA_BUILD_VERSION__` ile body'deki
       script injection'ına paylaşıyoruz; flutter_bootstrap.js URL'sine
       ?v=<version> ekleyerek SW + CDN cache'i bypass'lar. -->
  <script>
    (function () {
      var BUILD_VERSION = '1.0.155+159';
      window.__KOALA_BUILD_VERSION__ = BUILD_VERSION;
      try {
        var KEY = 'koala_build_v';
        var ONCE = 'koala_kill_done';
        var prev = null;
        try { prev = localStorage.getItem(KEY); } catch (_) {}
        if (prev === BUILD_VERSION) return;
        // Sonsuz reload koruması: aynı session içinde bir kez reload edildiyse
        // daha tetikleme. Chrome mobile private mode ya da localStorage blok'u
        // halinde localStorage.setItem sessizce başarısız olur ve script tekrar
        // tekrar reload tetikleyebilir — sessionStorage flag'i ile bunu kır.
        var alreadyDone = false;
        try { alreadyDone = sessionStorage.getItem(ONCE) === '1'; } catch (_) {}
        if (alreadyDone) {
          // Persist edilemediyse de en azından aynı turda reload döngüsüne girme.
          try { localStorage.setItem(KEY, BUILD_VERSION); } catch (_) {}
          return;
        }
        try { sessionStorage.setItem(ONCE, '1'); } catch (_) {}
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () {
            if ('caches' in window) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }
          }).then(function () {
            try { localStorage.setItem(KEY, BUILD_VERSION); } catch (_) {}
            if (prev) location.reload();
          }).catch(function () {
            // SW/cache temizliği patlasa bile sayfayı boot et — beyaz ekran tutma.
            try { localStorage.setItem(KEY, BUILD_VERSION); } catch (_) {}
          });
        } else {
          try { localStorage.setItem(KEY, BUILD_VERSION); } catch (_) {}
        }
      } catch (_) {}
    })();
  </script>

  <style>
    input:-webkit-autofill,

    /* Motor inerken görünen taban — Flutter SplashScreen'in krem tonuyla aynı. */
    html, body { margin: 0; padding: 0; background-color: #F7F4EF; }

    /* Pre-Flutter splash — Flutter SplashScreen ile BİREBİR aynı: aynı
       koala logosu, aynı soft iç-mekan arka planı, aynı boyut/gölge/bar.
       HTML parse olur olmaz görünür (logo anında gelir, motor inmesini
       beklemez). Flutter mount olunca aynı görüntü devralır → geçiş
       görünmez, "ikinci ekran" hissi yok. */
    #koala-preloader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F7F4EF;
      background-image: url('assets/assets/images/splash_bg.webp');
      background-size: cover;
      background-position: center;
      transition: opacity 250ms ease-out;
    }
    #koala-preloader .kp-logo {
      width: clamp(216px, 56vw, 252px);
      aspect-ratio: 1 / 1;
      border-radius: 22.5%;
      background-image: url('assets/assets/images/koala_splash_logo.webp');
      background-size: cover;
      background-position: center;
      /* Flutter'daki iki katmanlı net gölgenin CSS karşılığı. */
      box-shadow: 0 18px 34px -14px rgba(0, 0, 0, 0.22),
                  0 4px 9px -3px rgba(0, 0, 0, 0.10);
      margin-bottom: 32px;
    }
    #koala-preloader .kp-bar {
      position: relative;
      width: 180px;
      height: 6px;
      border-radius: 999px;
      background-color: #E0DCEC;
      overflow: hidden;
    }
    #koala-preloader .kp-bar::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6C63FF 0%, #9B5CFF 100%);
      animation: kp-sweep 1.4s ease-in-out infinite;
    }
    @keyframes kp-sweep {
      0%   { left: -45%; }
      100% { left: 100%; }
    }
    #koala-preloader.hidden { opacity: 0; pointer-events: none; }
  </style>

<body>
  <div id="koala-preloader" aria-hidden="true">
    <div class="kp-logo"></div>
    <div class="kp-bar"></div>
  </div>
  <script>
    // Preloader, Flutter SplashScreen ile birebir aynı. Flutter mount olunca
    // (flt-glass-pane) HEMEN gizlemeyiz — Flutter tarafı aynı görseli decode
    // edip çizene kadar ~450ms bekleriz, sonra 250ms fade ile devrederiz.
    // İki ekran aynı olduğu için bu bekleme görünmez; tek amacı handoff'ta
    // flaş/boşluk olmaması. 20sn hard cap: Flutter mount olamazsa takılma.
    (function () {
      var preloader = document.getElementById('koala-preloader');
      if (!preloader) return;
      var hidden = false;
      function hide() {
        if (hidden) return;
        hidden = true;
        preloader.classList.add('hidden');
        setTimeout(function () {
          if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
        }, 300);
      }
      var pollId = setInterval(function () {
        if (document.querySelector('flt-glass-pane')) {
          clearInterval(pollId);
          setTimeout(hide, 450);
        }
      }, 80);
      setTimeout(function () { clearInterval(pollId); hide(); }, 20000);
    })();
  </script>
  <!-- 2026-05-28 FIX 2: flutter_bootstrap.js'i versiyonlu URL ile yükle.
       SW ve CDN her deploy'da farklı URL gördüğü için stale main.dart.js
       riski biter. BUILD_VERSION head'deki cache-bust script'inden okunur. -->
  <script>
    (function () {
      var v = window.__KOALA_BUILD_VERSION__ || 'dev';
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(v);
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
