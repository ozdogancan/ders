  <!-- 2026-04-27: Aggressive cache-bust — bu build'in versiyonunu localStorage'da
       tut, eski versiyondaysa SW + cacheStorage temizle ve sayfayı bir kez
       yenile. Her deploy'da BUILD_VERSION değiştir; Vercel cache yine de
       kullanıcıya yeni index.html veriyor (no-cache). -->
  <script>
    (function () {
      var BUILD_VERSION = '1.0.104+108';
      try {
        var KEY = 'koala_build_v';
        var ONCE = 'koala_kill_done';
        var prev = null;
        try { prev = localStorage.getItem(KEY); } catch (_) {}
        if (prev === BUILD_VERSION) return;
        // Sonsuz reload koruması: aynı session içinde bir kez reload edildiyse
        // daha tetikleme. Chrome mobile private mode ya da localStorage blok'u
        // halinde localStorage.setItem sessizce başarısız olur ve script tekrar
        // tekrar reload tetikleyebilir — sessionStorage flag'i ile bunu kır.
        var alreadyDone = false;
        try { alreadyDone = sessionStorage.getItem(ONCE) === '1'; } catch (_) {}
        if (alreadyDone) {
          // Persist edilemediyse de en azından aynı turda reload döngüsüne girme.
          try { localStorage.setItem(KEY, BUILD_VERSION); } catch (_) {}
          return;
        }
        try { sessionStorage.setItem(ONCE, '1'); } catch (_) {}
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () {
            if ('caches' in window) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }
          }).then(function () {
            try { localStorage.setItem(KEY, BUILD_VERSION); } catch (_) {}
            if (prev) location.reload();
          }).catch(function () {
            // SW/cache temizliği patlasa bile sayfayı boot et — beyaz ekran tutma.
            try { localStorage.setItem(KEY, BUILD_VERSION); } catch (_) {}
          });
        } else {
          try { localStorage.setItem(KEY, BUILD_VERSION); } catch (_) {}
        }
      } catch (_) {}
    })();
  </script>
